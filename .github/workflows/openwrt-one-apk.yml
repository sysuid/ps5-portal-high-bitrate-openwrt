name: OpenWrt One APK

on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/**']
    paths: ['openwrt/**', '*.py', 'tests/**', '.github/workflows/openwrt-one-apk.yml']
  pull_request:
    paths: ['openwrt/**', '*.py', 'tests/**', '.github/workflows/openwrt-one-apk.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s openwrt/tests -v
          sh -n openwrt/install.sh
          sh -n openwrt/files/portal-bitrate.init
          node --check openwrt/luci/htdocs/luci-static/resources/view/portal-bitrate/settings.js

  apk:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDK: openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64
      SDK_URL: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic
    steps:
      - uses: actions/checkout@v4
      - name: SDK prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget zstd
      - name: Fetch and verify matching official SDK
        run: |
          curl --fail --location --retry 3 "$SDK_URL/$SDK.tar.zst" -o "$RUNNER_TEMP/$SDK.tar.zst"
          curl --fail --location --retry 3 "$SDK_URL/sha256sums" -o "$RUNNER_TEMP/sha256sums"
          cd "$RUNNER_TEMP"
          grep " $SDK.tar.zst$" sha256sums | sha256sum -c -
          tar --zstd -xf "$SDK.tar.zst"
      - name: Stage application and package recipe
        run: |
          python3 openwrt/stage_sdk.py
          mkdir -p "$RUNNER_TEMP/$SDK/package/portal-bitrate/src"
          cp openwrt/package/Makefile "$RUNNER_TEMP/$SDK/package/portal-bitrate/Makefile"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/$SDK/package/portal-bitrate/src"
          cp -a release-assets "$RUNNER_TEMP/$SDK/package/portal-bitrate/src/"
      - name: Resolve SDK package metadata and build APK
        working-directory: ${{ runner.temp }}/${{ env.SDK }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf '%s\n' 'CONFIG_PACKAGE_portal-bitrate=m' 'CONFIG_SIGNED_PACKAGES=y' >> .config
          make defconfig
          make package/portal-bitrate/compile -j2 V=s
      - name: Collect APK and provenance
        run: |
          mkdir -p apk-artifacts
          find "$RUNNER_TEMP/$SDK/bin" -name 'portal-bitrate*.apk' -exec cp {} apk-artifacts/ \;
          test -n "$(find apk-artifacts -name '*.apk' -print -quit)"
          printf 'source=%s\nopenwrt=25.12.5\ntarget=mediatek/filogic\ndevice=openwrt,one\npackage=pure Python/scripts (architecture independent)\n' "$GITHUB_SHA" > apk-artifacts/BUILDINFO
          cp "$RUNNER_TEMP/$SDK/.config" apk-artifacts/sdk.config
          cd apk-artifacts
          sha256sum *.apk BUILDINFO sdk.config > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: portal-bitrate-openwrt-one-25.12.5-apk
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 30
